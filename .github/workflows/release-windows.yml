name: Release Windows

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      version:
        description: "Version to build (e.g. 0.1.0). Defaults to ref name or 0.0.0-ci."
        required: false
        type: string

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: "1.25.0"
          cache-dependency-path: go.sum

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Resolve version
        id: version
        shell: pwsh
        run: |
          $version = "${{ inputs.version }}"
          if (-not $version) {
            $ref = "${{ github.ref_name }}"
            if ($ref -match '^v(.+)$') {
              $version = $Matches[1]
            } else {
              $version = "0.0.0-ci"
            }
          }
          if ($version -match '^v') {
            $version = $version.Substring(1)
          }
          "version=$version" >> $env:GITHUB_OUTPUT
          Write-Host "Building version $version"

      - name: Install Wails CLI
        run: go install github.com/wailsapp/wails/v2/cmd/wails@v2.12.0

      - name: Install NSIS
        shell: pwsh
        run: |
          choco install nsis -y --no-progress
          $makensis = @(
            "${env:ProgramFiles(x86)}\NSIS\makensis.exe",
            "$env:ProgramFiles\NSIS\makensis.exe"
          ) | Where-Object { Test-Path $_ } | Select-Object -First 1
          if (-not $makensis -and $env:ChocolateyInstall) {
            $found = Get-ChildItem "$env:ChocolateyInstall\lib\nsis" -Recurse -Filter makensis.exe -ErrorAction SilentlyContinue | Select-Object -First 1
            if ($found) { $makensis = $found.FullName }
          }
          if (-not $makensis) {
            throw "makensis.exe not found after NSIS install"
          }
          $nsisDir = Split-Path $makensis -Parent
          Write-Host "NSIS directory: $nsisDir"
          Add-Content -Path $env:GITHUB_PATH -Value $nsisDir

      - name: Inject version metadata
        shell: pwsh
        run: ./scripts/inject-version.ps1 -Version ${{ steps.version.outputs.version }}

      - name: Run tests
        run: |
          go test ./...
          npm ci --prefix frontend
          npm test --prefix frontend

      - name: Build application and installer
        shell: pwsh
        run: |
          $version = "${{ steps.version.outputs.version }}"
          wails build -platform windows/amd64 -clean -nsis -webview2 embed -ldflags "-X mtgcollection/internal/version.Version=$version"
          if ($LASTEXITCODE -ne 0) {
            throw "wails build failed (exit $LASTEXITCODE)"
          }
          $installer = Get-ChildItem build/bin -Filter "*-installer.exe" | Select-Object -First 1
          if (-not $installer) {
            throw "NSIS installer not found under build/bin after wails build -nsis"
          }

      - name: Generate checksums
        shell: pwsh
        run: |
          $files = @(
            (Get-Item "build\bin\mtg-collection.exe").FullName
          )
          $installer = Get-ChildItem build\bin -Filter "*-installer.exe" | Select-Object -First 1
          if ($installer) {
            $files += $installer.FullName
          }
          $lines = foreach ($file in $files) {
            $hash = Get-FileHash -Path $file -Algorithm SHA256
            "$($hash.Hash)  $(Split-Path $file -Leaf)"
          }
          $lines | Set-Content build/bin/checksums.txt -Encoding utf8
          Get-Content build/bin/checksums.txt

      - name: Publish GitHub release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            build/bin/mtg-collection.exe
            build/bin/*-installer.exe
            build/bin/checksums.txt
          generate_release_notes: true

      - name: Upload workflow artifacts
        if: ${{ !startsWith(github.ref, 'refs/tags/v') }}
        uses: actions/upload-artifact@v4
        with:
          name: windows-${{ steps.version.outputs.version }}
          path: |
            build/bin/mtg-collection.exe
            build/bin/*-installer.exe
            build/bin/checksums.txt
